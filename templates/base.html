<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>{% block title %}Registro pagamenti{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='categories.css') }}"></head><body>
<header><div><strong>Registro pagamenti</strong>{% if g.user %}<small>{{ g.user.display_name }} · {{ g.user.role }}</small>{% endif %}</div>{% if g.user %}<form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="link">Esci</button></form>{% endif %}</header>
<main>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body></html>
